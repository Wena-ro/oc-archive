<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>晓律 Xiaolv · OC Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f2f5; --card:#fff; --ink:#141316; --mute:#7b7a82; --line:#e6e5ea;
  --lime:#c8f25a; --lime-d:#141316; --panel:#a3a2a9; --r:28px;
  --f:"Plus Jakarta Sans","Noto Sans SC",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
body{font-family:var(--f);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
img{display:block;max-width:100%}
a{color:inherit}

/* top bar + hero */
.hero{height:200px;position:relative;overflow:hidden;
  background:
   radial-gradient(ellipse 60% 120% at 20% 120%, #f4f3f6 0, transparent 60%),
   repeating-radial-gradient(ellipse 130% 100% at 90% -40%, #e7e6ea 0 30px, #dddce1 34px, #ecebef 40px, #e7e6ea 64px),
   #e7e6ea}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(243,242,245,0) 40%,rgba(243,242,245,.6))}
.bar{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:12px;padding:16px 24px}
.logo{font-weight:800;font-size:20px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.logo b{background:var(--ink);color:#fff;border-radius:10px;padding:2px 9px}
.logo span{color:var(--mute);font-weight:600}
.bar .sp{flex:1}
.pill{height:38px;padding:0 16px;border-radius:99px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pill.lime{background:var(--lime);color:var(--ink)} .pill.lime:hover{background:#d6fa74}
.pill.ghost{background:rgba(255,255,255,.75);border:1px solid var(--line)}
.pill.dark{background:var(--ink);color:#fff}
.hidden{display:none!important}

/* layout */
.wrap{display:grid;grid-template-columns:300px 1fr;gap:0;max-width:1440px;margin:-130px auto 0;position:relative;z-index:2;padding:0 24px 80px}
aside{padding:0 24px 0 16px;position:sticky;top:16px;align-self:start}
.avatar-wrap{position:relative;width:132px;margin-bottom:22px}
.avatar{width:132px;height:178px;border-radius:22px;overflow:hidden;
  background:linear-gradient(160deg,#f1f0f3,#c9c8ce 60%,#9e9da4);display:grid;place-items:center;font-size:64px;font-weight:900;color:#fff}
.avatar img{width:100%;height:100%;object-fit:cover}
.bubble{position:absolute;top:-22px;left:112px;background:#ebeaee;border-radius:50%;min-width:54px;height:48px;padding:0 10px;display:grid;place-items:center;font-size:14px}
.bubble::after{content:"";position:absolute;left:4px;bottom:2px;width:12px;height:12px;background:#ebeaee;border-radius:50%;transform:translate(-8px,6px)}
.edit-hint{position:absolute;inset:auto 6px 6px 6px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;border-radius:8px;text-align:center;padding:3px}
h1{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1}
.latin{color:var(--mute);font-weight:600;margin-top:6px}
.stats{display:flex;gap:10px;color:var(--mute);font-size:13px;margin:10px 0 18px}
.sec{border-top:1px solid var(--line);padding:16px 0}
.bio{font-size:15px;line-height:1.6}
.chip{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:99px;background:#e9e8ec;font-size:12px;font-weight:500;color:#55545b;gap:4px}
.sec-h{font-size:12px;font-weight:700;color:var(--mute);letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px}
.rel{display:flex;gap:14px;flex-wrap:wrap}
.rel button{display:flex;flex-direction:column;align-items:center;gap:6px;width:60px}
.rel .ra{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px;}

.rel .rn{font-size:13px;font-weight:600}
.rel .rl{font-size:11px;color:var(--mute);margin-top:-4px}
.rel .add .ra{background:#e9e8ec;color:var(--mute);box-shadow:none;border-style:dashed;border-color:#cfced5}
.spot{background:#fff;border-radius:18px;padding:12px;display:flex;gap:12px;align-items:center}
.spot .sic{width:44px;height:44px;border-radius:12px;background:var(--ink);display:grid;place-items:center;flex:none}
.spot small{color:var(--mute);display:block;font-size:12px}
.spot input{width:100%;border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:12px;margin-top:6px}
.spot iframe{width:100%;border:0;border-radius:12px}

/* tabs + main */
main{min-width:0}
.tabs{display:flex;gap:0;padding-left:0}
.tab{height:62px;padding:0 54px;border-radius:30px 30px 0 0;font-size:18px;font-weight:700;background:#e4e3e8;color:#5c5b62;margin-right:-18px;position:relative}
.tab.on{background:var(--card);color:var(--ink);z-index:2}
.board{background:var(--card);border-radius:0 var(--r) var(--r) var(--r);padding:24px;min-height:600px}

.aus{background:var(--panel);border-radius:var(--r);padding:20px 0 22px;position:relative}
.aus-head{display:flex;align-items:center;gap:10px;padding:0 22px 14px;color:#fff;font-weight:800;font-size:18px}
.aus-head .chip{background:rgba(255,255,255,.25);color:#fff}
.aus-head .sp{flex:1}
.aus-head .pill{background:rgba(255,255,255,.22);color:#fff;font-size:14px}
.au-edit{width:38px;height:38px;border-radius:50%;background:#efeef2;display:grid;place-items:center;margin-left:auto;font-size:15px}
.track{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:22px;padding:0 22px 4px;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.au{flex:0 0 min(440px,82%);scroll-snap-align:start;background:#fff;border-radius:24px;overflow:hidden;cursor:pointer;border:2px solid transparent;text-align:left}

.au.on{border-color:var(--ink)}
.banner{aspect-ratio:16/7;position:relative;overflow:hidden}
.banner img{width:100%;height:100%;object-fit:cover}
.banner .ph{position:absolute;inset:0;display:flex;align-items:flex-end;padding:14px 18px;font-size:64px;font-weight:900;color:rgba(255,255,255,.9);letter-spacing:-.04em}
.banner .bbtn{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;border-radius:99px;padding:5px 11px}
.au-body{padding:16px 18px 18px}
.au-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.au-title{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-right:4px}
.au-tag{color:#9a99a0;font-size:15px;margin-top:2px}
.au-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.au-desc{margin-top:12px;border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:14px;line-height:1.6;color:#45444a;min-height:52px}
.au-meta{margin-top:10px;font-size:12px;color:var(--mute)}
.arrow{position:absolute;top:50%;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.9);font-size:18px;display:grid;place-items:center;z-index:3}
.arrow.l{left:8px}.arrow.r{right:8px}

.gh{display:flex;align-items:flex-end;border-bottom:1px solid var(--line);margin-top:40px}
.gh .gt{font-size:22px;font-weight:700;padding:0 22px 14px;border-bottom:3px solid var(--ink);margin-bottom:-1px}
.gh .sp{flex:1}
.gh .pill{margin-bottom:10px;height:40px;padding:0 20px;font-size:15px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:22px 0 22px}
.seg{display:inline-flex;background:#eeedf1;border-radius:99px;padding:4px}
.seg button{height:30px;padding:0 13px;border-radius:99px;font-size:13px;font-weight:600;color:#5c5b62}
.seg button.on{background:var(--ink);color:#fff}
.tagrow{display:flex;gap:6px;flex-wrap:wrap}
.tagrow button.chip.on{background:var(--ink);color:#fff}
.filters .sp{flex:1}
.filters select{border:0;background:none;font-weight:600;font-size:13px}

.note{background:#f6f5f8;border:1px dashed #cfced5;border-radius:14px;padding:10px 14px;font-size:13px;color:#5c5b62;margin-bottom:16px}
.masonry{columns:4 220px;column-gap:14px}
.tile{break-inside:avoid;margin-bottom:18px;display:block;width:100%;text-align:left;cursor:zoom-in}
.tile .frame{position:relative}
.tile img{width:100%;height:auto;border-radius:14px;background:#eceaee}
.tile .kind{position:absolute;top:18px;left:18px;font-size:11px;font-weight:700;background:rgba(255,255,255,.92);border-radius:99px;padding:3px 9px}
.cr{position:absolute;right:10px;bottom:10px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.cr i,.crow .ci{font-style:normal;width:100%;height:100%;border-radius:50%;display:grid;place-items:center;font-weight:600;color:#3a393e;font-size:14px}
.crow .ci{background:#e8e7eb}
.tile .t{font-weight:600;font-size:15px;margin:10px 2px 0;letter-spacing:-.01em;color:#1d1d1f}
.empty{padding:60px 0;text-align:center;color:var(--mute)}

.about{max-width:720px}
.about dl{display:grid;grid-template-columns:120px 1fr;border-top:1px solid var(--line)}
.about dt,.about dd{padding:14px 0;border-bottom:1px solid var(--line);font-size:15px}
.about dt{color:var(--mute);font-weight:600}
.about h3{font-size:20px;margin:28px 0 10px}

/* modals */
.mask{position:fixed;inset:0;background:rgba(20,19,22,.55);z-index:50;display:grid;place-items:center;padding:20px}
.modal{background:#fff;border-radius:28px;width:min(640px,100%);max-height:92vh;overflow:auto;padding:26px}
.modal h2{font-size:22px;font-weight:800;margin-bottom:16px;display:flex;align-items:center}
.modal h2 .x{margin-left:auto;font-size:22px;color:var(--mute)}
.drop{border:2px dashed #cfced5;border-radius:20px;padding:26px;text-align:center;color:var(--mute);cursor:pointer;transition:background .15s}
.drop.over,.drop:hover{background:#f6f5f8;border-color:#8f8e95}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:12px}
.pv{border-radius:12px;overflow:hidden;background:#eeedf1;font-size:11px}
.pv img{width:100%;aspect-ratio:1;object-fit:cover}
.pv div{padding:5px 7px;color:#45444a}
.field{margin-top:14px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.field label i{font-style:normal;font-weight:500;color:var(--mute)}
.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;background:#fafafb}
.field textarea{min-height:76px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.picks{display:flex;gap:6px;flex-wrap:wrap}
.picks button{height:32px;padding:0 13px;border-radius:99px;border:1px solid var(--line);font-size:13px;font-weight:600}
.picks button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.lockf input{background:#f1f0f3;border-color:#dcdbe0}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}

.lbx{position:fixed;inset:20px;background:#f5f5f6;border-radius:28px;display:grid;grid-template-columns:330px 1fr;overflow:auto;z-index:51}
.lbx-x{position:absolute;top:26px;left:30px;font-size:28px;line-height:1}
.lbx-act{position:absolute;top:26px;right:30px;display:flex;gap:22px}
.lbx-act button{font-size:17px;font-weight:600;display:flex;align-items:center;gap:6px}
.lbx-meta{padding:110px 34px 40px 70px;display:flex;flex-direction:column;gap:0}
.badge{align-self:flex-start;background:#e3e2e7;color:var(--ink);font-weight:700;font-size:16px;border-radius:14px;padding:9px 16px;margin-bottom:28px}
.crumb{font-size:20px;font-weight:500;color:#2a292d}
.lbx-meta h3{font-size:34px;font-weight:700;margin:18px 0 22px;letter-spacing:-.02em;word-break:break-word}
.lbx-meta .ln{border-top:1px solid #dddce1}
.crow{display:flex;align-items:center;gap:14px;padding:22px 0;text-decoration:none}
.crow .ci{width:52px;height:52px;flex:none;font-size:20px}
.crow b{display:block;font-size:17px}.crow small{color:var(--mute);font-size:14px}
.crow .go{margin-left:auto;color:#b5b4bb;font-size:22px}
.lbx-meta p{font-size:15px;line-height:1.7;color:#45444a;white-space:pre-wrap;padding:22px 0 0}
.lbx-meta .tg{padding-top:16px;display:flex;gap:6px;flex-wrap:wrap}
.price{background:#ebeaee;border-radius:12px;padding:9px 13px;margin-top:18px;font-size:14px}
.date{margin-top:auto;padding-top:40px;color:#9a99a0;font-size:16px}
.lbx-fig{display:grid;place-items:center;padding:110px 60px 60px 20px}
.lbx-fig .card{}
.lbx-fig img{max-height:calc(100vh - 200px);width:auto;max-width:100%;border-radius:14px}
.crop{background:#ecebef;border-radius:28px;width:min(1000px,96vw);overflow:hidden}
.crop-h{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 22px;background:#f6f6f7}
.crop-h .x{font-size:26px;justify-self:start}
.crop-h b{font-size:18px;font-weight:600}
.crop-h .pill{justify-self:end;height:44px;padding:0 26px;font-size:16px}
.stage{position:relative;overflow:hidden;touch-action:none;cursor:grab;user-select:none}
.stage:active{cursor:grabbing}
.stage img{position:absolute;max-width:none;pointer-events:none}
.cframe{position:absolute;box-shadow:0 0 0 4px #141316,0 0 0 9999px rgba(236,235,239,.6);pointer-events:none}
.ctl{display:flex;justify-content:center;align-items:center;gap:14px;padding:6px 0 26px}
.zoom{display:flex;align-items:center;gap:14px;background:#f6f6f7;border-radius:99px;padding:14px 22px;width:min(440px,70vw)}
.zoom input{flex:1;accent-color:#141316}
.zoom svg{flex:none}
.reset{width:58px;height:58px;border-radius:50%;background:#f6f6f7;display:grid;place-items:center;font-size:20px}
.aud{display:block}
.aud-in{max-width:780px;margin:0 auto;padding:90px 24px 90px}
.aud-b{border-radius:24px;margin-bottom:28px}
.aud-t{font-size:44px;font-weight:700;letter-spacing:-.03em;margin-top:8px}
.aud-d{font-size:16px;line-height:1.8;color:#45444a;margin-top:18px;white-space:pre-wrap}
.aud .gh{margin-top:48px}
.sn{padding:28px 0;border-bottom:1px solid var(--line)}
.sn h4{font-size:19px;font-weight:700;margin-bottom:12px}
.sn .body{font-size:16px;line-height:1.95;white-space:pre-wrap;color:#2a292d}
.sn .body.clip{max-height:15.6em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 65%,transparent);mask-image:linear-gradient(#000 65%,transparent)}
.sn .more,.sn .ops button{color:var(--mute);font-size:14px;margin-top:10px}
.sn .ops{display:flex;gap:18px}
.sn-empty{color:var(--mute);padding:28px 0;font-size:15px}
.au-open{color:var(--mute);font-size:12px;margin-left:8px}
.au-open:hover{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

@media (max-width:900px){
  .wrap{grid-template-columns:1fr;margin-top:-120px;padding:0 14px 60px}
  aside{position:static;padding:0 6px 20px}
  .tab{padding:0 32px;font-size:16px}
  .board{padding:14px}
  .lbx{grid-template-columns:1fr;inset:8px}
  .lbx-meta{padding:80px 24px 10px;order:2}
  .lbx-fig{padding:70px 12px 0;order:1}
  .date{padding-top:20px}
  .row2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="hero">
  <div class="bar">
    <div class="logo"><b>OC</b>archive <span>/ xiaolv</span></div>
    <div class="sp"></div>
    <button class="pill ghost hidden" id="ghBtn"></button>
    <button class="pill ghost" id="lockBtn">🔒 解锁价格</button>
  </div>
</div>

<div class="wrap">
  <aside id="side"></aside>
  <main>
    <div class="tabs">
      <button class="tab on" data-tab="gallery">Gallery</button>
      <button class="tab" data-tab="about">About</button>
    </div>
    <div class="board">
      <section id="gallery"></section>
      <section id="about" class="about hidden"></section>
    </div>
  </main>
</div>

<div id="layer"></div>
<div class="toast" id="toast"></div>
<input type="file" id="singlePick" accept="image/*,.heic,.heif" hidden>

<script>
/* ===================================================================
   编辑开关：true = 编辑模式（能加图、改世界观、删除）；false = 浏览模式（别人看到的样子）
   =================================================================== */
const EDIT_MODE = true;

/* ===== 角色数据（之后推到 GitHub 时会拆成 data/characters/xiaolv.json） ===== */
const CHAR = {
  id:'xiaolv', name:'晓律', latin:'Xiaolv', bubble:'略', initial:'律',
  bio:'一位恬静的拽比', tags:['oc'],
  related:[{id:'yulan', name:'渝岚', label:'高中同学', color:'linear-gradient(160deg,#e3e2e7,#a6a5ac)', initial:'岚'}],
  aus:[
    {id:'17', title:'17', sub:'高中', chips:['2d','oc'], color:'linear-gradient(135deg,#f5f4f7,#d8d7dc 60%,#b9b8be)',
     desc:'上课睡觉、在乐队弹贝斯、不守规矩的年纪。看起来很疏离，其实意外地好相处。'},
    {id:'27', title:'27', sub:'设计师', chips:['oc'], color:'linear-gradient(135deg,#e9e8ec,#c3c2c8 60%,#8f8e95)',
     desc:'设计师。'},
    {id:'7', title:'7', sub:'小时候', chips:['oc'], color:'linear-gradient(135deg,#f7f6f8,#e0dfe4 60%,#c6c5cb)',
     desc:'还只是个小孩。'},
    {id:'fem', title:'Fem', sub:'性转', chips:['oc'], color:'linear-gradient(135deg,#efeef2,#cfced4 55%,#a7a6ad)',
     desc:'性转 AU。'}
  ]
};
const KIND = {design:'服设', illus:'插图'};

/* ===== 存储（预览版：存在这台浏览器里；GitHub 版会换成提交到仓库） ===== */
let dbp=null;
try{ dbp=new Promise((res,rej)=>{const r=indexedDB.open('oc-archive-'+CHAR.id,1);
  r.onupgradeneeded=()=>{r.result.createObjectStore('items',{keyPath:'id'});r.result.createObjectStore('meta')};
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);}); dbp.catch(()=>{dbp=null}); }catch(e){dbp=null}
const mem={items:new Map(),meta:new Map()};
async function tx(store,mode,fn){
  if(dbp){ try{ const db=await dbp; return await new Promise((res,rej)=>{const t=db.transaction(store,mode);const r=fn(t.objectStore(store));
      t.oncomplete=()=>res(r&&r.result); t.onerror=()=>rej(t.error);}); }catch(e){console.warn(e)} }
  return undefined;
}
const localStore={
  async load(){},
  async all(){ const v=await tx('items','readonly',s=>s.getAll()); return v||[...mem.items.values()]; },
  async put(it){ mem.items.set(it.id,it); await tx('items','readwrite',s=>s.put(it)); },
  async del(id){ mem.items.delete(id); await tx('items','readwrite',s=>s.delete(id)); },
  async get(k){ const v=await tx('meta','readonly',s=>s.get(k)); return v!==undefined?v:mem.meta.get(k); },
  async set(k,v){ mem.meta.set(k,v); await tx('meta','readwrite',s=>s.put(v,k)); }
};

/* ===== GitHub 存储：网站放在 xxx.github.io 上时自动启用 =====
   数据存在仓库的 data/site.json，图片存在 images/ 文件夹。
   写入需要你在网页上「连接 GitHub」一次（token 只存在你自己的浏览器里）。 */
const GH=(()=>{ const h=location.hostname; if(!h.endsWith('.github.io')) return null;
  const owner=h.split('.')[0], seg=location.pathname.split('/').filter(Boolean)[0];
  return {owner, repo:(seg&&!seg.includes('.'))?seg:h}; })();
let ghToken=null; try{ ghToken=localStorage.getItem('oc-gh-token'); }catch(e){}
const DB={meta:{},items:[]}; let dbSha=null, ghQ=Promise.resolve();
function ghApi(path,opt={}){ return fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}${path}`,{...opt,cache:'no-store',
  headers:{Accept:'application/vnd.github+json',...(ghToken?{Authorization:'Bearer '+ghToken}:{}),...(opt.body?{'Content-Type':'application/json'}:{})}}); }
function bytesB64(u){ let s=''; for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s); }

async function ghPut(path,content,message,sha){
  if(!ghToken) throw new Error('还没连接 GitHub');
  const r=await ghApi('/contents/'+path,{method:'PUT',body:JSON.stringify({message,content,...(sha?{sha}:{})})});
  if(!r.ok){ const e=new Error((await r.json().catch(()=>({}))).message||('HTTP '+r.status)); e.status=r.status; throw e; }
  return (await r.json()).content.sha;
}
async function ghSha(path){ const r=await ghApi('/contents/'+path); return r.ok?(await r.json()).sha:null; }
async function ghUpload(blob,name){ const path=`images/${name}.${blob.type==='image/gif'?'gif':'webp'}`;
  await ghPut(path,await blobB64(blob),'add '+path); return path; }
function ghSave(msg){ return ghQ=ghQ.then(async()=>{
  const content=bytesB64(new TextEncoder().encode(JSON.stringify(DB,null,1)));
  try{ dbSha=await ghPut('data/site.json',content,msg,dbSha); }
  catch(e){ if(e.status===409||e.status===422){ dbSha=await ghSha('data/site.json'); dbSha=await ghPut('data/site.json',content,msg,dbSha); } else throw e; }
}); }
const ghSafe=fn=>async(...a)=>{ try{ return await fn(...a); }catch(e){ console.warn(e); toast('⚠️ 没存到 GitHub：'+e.message); } };
const ghStore={
  async load(){
    let data=null;
    if(ghToken){ const r=await ghApi('/contents/data/site.json');
      if(r.ok){ const j=await r.json(); dbSha=j.sha; data=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(j.content.replace(/\n/g,'')),c=>c.charCodeAt(0)))); } }
    if(!data){ const r=await fetch('data/site.json?t='+Date.now()).catch(()=>null); if(r&&r.ok) data=await r.json(); }
    if(data){ DB.meta=data.meta||{}; DB.items=data.items||[]; }
  },
  async all(){ return DB.items.map(r=>({...r})); },
  put:ghSafe(async it=>{
    const rec={}; for(const k in it) if(k[0]!=='_') rec[k]=it[k];
    for(const [k,pk,suf] of [['full','_fp',''],['thumb','_tp','-t']]){ const v=it[k];
      if(v instanceof Blob){ const p=it[pk]||await ghUpload(v,it.id+suf); it[pk]=p; rec[k]=p; } }
    const i=DB.items.findIndex(x=>x.id===it.id); if(i<0) DB.items.push(rec); else DB.items[i]=rec;
    await ghSave('update '+(rec.title||rec.id));
  }),
  del:ghSafe(async id=>{
    const rec=DB.items.find(x=>x.id===id); DB.items=DB.items.filter(x=>x.id!==id); await ghSave('delete '+id);
    for(const p of [rec?.full,rec?.thumb]) if(typeof p==='string'&&p.startsWith('images/')){ const sha=await ghSha(p);
      if(sha) await ghApi('/contents/'+p,{method:'DELETE',body:JSON.stringify({message:'delete '+p,sha})}); }
  }),
  async get(k){ return DB.meta[k]; },
  set:ghSafe(async(k,v)=>{
    if(v instanceof Blob) DB.meta[k]=await ghUpload(v,k.replace(/[^\w-]/g,'_')+'-'+Date.now());
    else if(v==null) delete DB.meta[k]; else DB.meta[k]=v;
    await ghSave('update '+k);
  })
};

const te=new TextEncoder(), td=new TextDecoder();
const b64=u=>btoa(String.fromCharCode(...u)), ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(pass,salt){const base=await crypto.subtle.importKey('raw',te.encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function encrypt(text,key=S.key){const iv=crypto.getRandomValues(new Uint8Array(12));
  return {iv:b64(iv),c:b64(new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,te.encode(text))))};}
async function decrypt(o,key=S.key){return td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(o.iv)},key,ub64(o.c)));}

/* ===== 图片处理：任何格式 → webp（大图 + 缩略图） ===== */
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
async function decodeImg(blob){const url=URL.createObjectURL(blob);const img=new Image();img.src=url;await img.decode();return {img,url};}
async function resize(img,max,q){const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
  const w=Math.round(img.naturalWidth*k),h=Math.round(img.naturalHeight*k);const c=document.createElement('canvas');c.width=w;c.height=h;
  c.getContext('2d').drawImage(img,0,0,w,h);const blob=await new Promise(r=>c.toBlob(r,'image/webp',q));return {blob,w,h};}
async function processFile(file){
  if(file.type==='image/gif'){const {img,url}=await decodeImg(file);URL.revokeObjectURL(url);
    return {full:file,thumb:file,w:img.naturalWidth,h:img.naturalHeight,orig:file.size,note:'GIF 保留原样'};}
  let src=file;
  if(/heic|heif/i.test(file.type)||/\.(heic|heif)$/i.test(file.name)){
    if(!window.heic2any) await loadScript('https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js');
    src=await heic2any({blob:file,toType:'image/jpeg',quality:.92}); if(Array.isArray(src)) src=src[0];
  }
  const {img,url}=await decodeImg(src);
  const full=await resize(img,2400,.86), th=await resize(img,720,.8); URL.revokeObjectURL(url);
  return {full:full.blob,thumb:th.blob,w:full.w,h:full.h,orig:file.size};
}
const kb=n=>n>1048576?(n/1048576).toFixed(1)+'MB':Math.max(1,Math.round(n/1024))+'KB';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const dateOf=i=>i.date||new Date(i.created||Date.now()).toISOString().slice(0,10);

  modal(`<div class="modal" style="width:min(420px,100%)"><h2>${lock?'解锁价格':'设置价格密码'}<button class="x" data-close>×</button></h2>

    const pw=$('#pw').value; if(!pw) return;
    try{

        await store.set('lock',{salt:b64(salt),check:await encrypt('ok')}); }
      else { const k=await derive(pw,ub64(lock.salt)); await decrypt(lock.check,k); S.key=k; }
    }catch(e){ $('#pwErr').textContent='密码不对'; return; }
    for(const i of S.items) if(i.priceEnc){ try{ i._price=await decrypt(i.priceEnc); }catch(e){} }
    closeModal(); renderAll(); toast('价格已解锁');
  };
  $('#pwGo').onclick=go; $('#pw').onkeydown=e=>{ if(e.key==='Enter') go(); }; $('#pw').focus();
}

/* 固定尺寸的图（头像、banner）：上传时拖动 + 缩放选显示区域 */
async function cropImage(file,opt){
  let src=file;
  if(/heic|heif/i.test(file.type)||/\.(heic|heif)$/i.test(file.name)){
    if(!window.heic2any) await loadScript('https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js');
    src=await heic2any({blob:file,toType:'image/jpeg',quality:.92}); if(Array.isArray(src)) src=src[0]; }
  const {img,url:u}=await decodeImg(src);
  const iw=img.naturalWidth, ih=img.naturalHeight;
  const SW=Math.min(1000,innerWidth*.96), SH=Math.min(560,innerHeight-230);
  let vw=Math.min(SW*.62,SH*.82*opt.ratio), vh=vw/opt.ratio; const fx=(SW-vw)/2, fy=(SH-vh)/2;
  const min=Math.max(vw/iw,vh/ih); let z=1, s=min, x=(vw-iw*s)/2, y=(vh-ih*s)/2;
  const ico=n=>`<svg width="${n}" height="${n}" viewBox="0 0 24 24" fill="#141316"><path d="M4 4h16a1 1 0 011 1v14a1 1 0 01-1 1H4a1 1 0 01-1-1V5a1 1 0 011-1zm1 13h14l-4.5-6-3.5 4.5-2.5-3L5 17z"/></svg>`;
  return new Promise(resolve=>{
    const box=document.createElement('div'); box.className='mask'; box.style.zIndex=80;
    box.innerHTML=`<div class="crop">
      <div class="crop-h"><button class="x" data-c aria-label="关闭">✕</button><b>调整${opt.name}</b><button class="pill lime" data-ok>Save</button></div>
      <div class="stage" style="width:${SW}px;height:${SH}px"><img src="${u}"><div class="cframe" style="left:${fx}px;top:${fy}px;width:${vw}px;height:${vh}px;border-radius:${opt.r}px"></div></div>
      <div class="ctl"><div class="zoom">${ico(18)}<input type="range" min="1" max="4" step="0.01" value="1">${ico(28)}</div>
        <button class="reset" data-reset title="复位">↺</button></div></div>`;
    document.body.appendChild(box);
    const cv=box.querySelector('.stage'), im=cv.querySelector('img'), rg=box.querySelector('input');
    const clamp=()=>{ x=Math.min(0,Math.max(vw-iw*s,x)); y=Math.min(0,Math.max(vh-ih*s,y)); };
    const draw=()=>{ clamp(); im.style.width=iw*s+'px'; im.style.left=fx+x+'px'; im.style.top=fy+y+'px'; };
    const zoomTo=nz=>{ nz=Math.min(4,Math.max(1,nz)); const ns=min*nz, cx=vw/2, cy=vh/2;
      x=cx-(cx-x)*ns/s; y=cy-(cy-y)*ns/s; s=ns; z=nz; rg.value=z; draw(); };
    draw();
    box.querySelector('[data-reset]').onclick=()=>{ z=1; s=min; x=(vw-iw*s)/2; y=(vh-ih*s)/2; rg.value=1; draw(); };
    let drag=null;
    cv.onpointerdown=e=>{ drag={px:e.clientX,py:e.clientY,x,y}; cv.setPointerCapture(e.pointerId); };
    cv.onpointermove=e=>{ if(!drag) return; x=drag.x+e.clientX-drag.px; y=drag.y+e.clientY-drag.py; draw(); };
    cv.onpointerup=cv.onpointercancel=()=>drag=null;
    cv.onwheel=e=>{ e.preventDefault(); zoomTo(z*(e.deltaY<0?1.08:1/1.08)); };
    rg.oninput=()=>zoomTo(+rg.value);
    const done=v=>{ box.remove(); URL.revokeObjectURL(u); resolve(v); };
    box.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>done(null));
    box.onclick=e=>{ if(e.target===box) done(null); };
    box.querySelector('[data-ok]').onclick=()=>{
      const W=opt.w, H=Math.round(W/opt.ratio), c=document.createElement('canvas'); c.width=W; c.height=H;
      const ctx=c.getContext('2d'); ctx.imageSmoothingQuality='high';
      ctx.drawImage(img,-x/s,-y/s,vw/s,vh/s,0,0,W,H);
      c.toBlob(b=>done(b),'image/webp',.88);
    };
  });
}

  const ed=$('#edit'); if(ed) ed.onclick=()=>{ closeModal(); openUpload(i); };
  const del=$('#del'); if(del) del.onclick=async()=>{
    if(del.dataset.sure){ await store.del(i.id); S.items=S.items.filter(x=>x.id!==i.id); closeModal(); renderAll(); toast('已删除'); }
    else { del.dataset.sure=1; del.textContent='再点一次确认删除'; del.style.color='#c0392b'; } };
}

/* ===== 启动 ===== */
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
  $('#gallery').classList.toggle('hidden',t.dataset.tab!=='gallery'); $('#about').classList.toggle('hidden',t.dataset.tab!=='about'); });
$('#lockBtn').onclick=openLock; $('#ghBtn').onclick=openGhConnect;
async function boot(){
  try{ await store.load(); const sa=await store.get('aus'); if(Array.isArray(sa)) S.aus=sa; S.items=await store.all()||[]; S.avatar=await store.get('avatar')||null; S.spotify=await store.get('spotify')||'';
    for(const a of S.aus){ const b=await store.get('banner:'+a.id); if(b) S.banners[a.id]=b; } }catch(e){ console.warn(e); }
  renderAll();
}
boot();
</script>
</body>
</html>
